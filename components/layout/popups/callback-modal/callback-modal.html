<div class="callback-modal-overlay" id="callbackModalOverlay" data-callback-modal hidden aria-hidden="true">
  <section class="callback-modal" role="dialog" aria-modal="true" aria-labelledby="callbackModalTitle" aria-describedby="callbackModalDescription">
    <div class="callback-modal__panel">
      <header class="callback-modal__header">
        <div class="callback-modal__header-top">
          <h2 class="callback-modal__title" id="callbackModalTitle">Заказать обратный звонок</h2>
          <button class="callback-modal__close" type="button" aria-label="Закрыть окно" data-callback-modal-close>
            <img class="callback-modal__close-icon callback-modal__close-icon--desktop" src="./static/images/popups/callback-modal/close-36.png" alt="">
            <img class="callback-modal__close-icon callback-modal__close-icon--mobile" src="./static/images/popups/callback-modal/close-24.png" alt="">
          </button>
        </div>
        <p class="callback-modal__description" id="callbackModalDescription">Оставьте ваши данные. И мы вам перезвоним в рабочее время</p>
      </header>

      <form class="callback-modal__form" id="callbackModalForm" action="#" method="post">
        <div class="callback-modal__fields">
          <label class="callback-modal__visually-hidden" for="callbackModalName">Имя</label>
          <input
            class="callback-modal__input"
            id="callbackModalName"
            name="name"
            type="text"
            placeholder="Имя*"
            autocomplete="name"
            required>

          <div class="callback-modal__phone services-contact__field--phone" data-callback-country-selector>
<button
                  class="services-contact__phone-country"
                  type="button"
                  aria-label="Выбрать код страны"
                  aria-haspopup="listbox"
                  aria-expanded="false"
                  aria-controls="callbackModalCountryList">
            <svg class="services-contact__phone-flag" viewBox="0 0 22 15" aria-hidden="true" focusable="false">
              <rect width="22" height="5" fill="#fff"></rect>
              <rect y="5" width="22" height="5" fill="#0039a6"></rect>
              <rect y="10" width="22" height="5" fill="#d52b1e"></rect>
            </svg>
            <span class="services-contact__phone-code">+7</span>
            <svg class="services-contact__phone-chevron" viewBox="0 0 14 14" aria-hidden="true" focusable="false">
              <path
                      d="m3.5 5 3.5 3.5L10.5 5"
                      fill="none"
                      stroke="currentColor"
                      stroke-linecap="round"
                      stroke-linejoin="round"
                      stroke-width="1.5"></path>
            </svg>
          </button>
          <div
                  class="services-contact__country-popup"
                  id="callbackModalCountryList"
                  role="listbox"
                  aria-label="Код страны"
                  hidden>
            <div class="services-contact__country-popup-header">
              <span class="services-contact__country-popup-title">Код страны:</span>
              <button class="services-contact__country-popup-close" type="button" aria-label="Закрыть список стран">
                <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                  <path
                          d="m6 6 12 12M18 6 6 18"
                          fill="none"
                          stroke="currentColor"
                          stroke-linecap="round"
                          stroke-width="1.8"></path>
                </svg>
              </button>
            </div>
            <div class="services-contact__country-container">
              <button
                      class="services-contact__country-option is-selected"
                      type="button"
                      role="option"
                      aria-selected="true"
                      data-country="ru"
                      data-code="+7"
                      data-name="Россия">
                <svg class="services-contact__country-flag" viewBox="0 0 22 15" aria-hidden="true" focusable="false">
                  <rect width="22" height="5" fill="#fff"></rect>
                  <rect y="5" width="22" height="5" fill="#0039a6"></rect>
                  <rect y="10" width="22" height="5" fill="#d52b1e"></rect>
                </svg>
                <span class="services-contact__country-code">+7</span>
                <span class="services-contact__country-name">Россия</span>
                <svg class="services-contact__country-check" viewBox="0 0 18 18" aria-hidden="true" focusable="false">
                  <path
                          d="m4 9 3.2 3.2L14 5.5"
                          fill="none"
                          stroke="currentColor"
                          stroke-linecap="round"
                          stroke-linejoin="round"
                          stroke-width="1.8"></path>
                </svg>
              </button>
              <button
                      class="services-contact__country-option"
                      type="button"
                      role="option"
                      aria-selected="false"
                      data-country="am"
                      data-code="+374"
                      data-name="Армения">
                <svg class="services-contact__country-flag" viewBox="0 0 22 15" aria-hidden="true" focusable="false">
                  <rect width="22" height="5" fill="#d90012"></rect>
                  <rect y="5" width="22" height="5" fill="#0033a0"></rect>
                  <rect y="10" width="22" height="5" fill="#f2a800"></rect>
                </svg>
                <span class="services-contact__country-code">+374</span>
                <span class="services-contact__country-name">Армения</span>
                <svg class="services-contact__country-check" viewBox="0 0 18 18" aria-hidden="true" focusable="false">
                  <path
                          d="m4 9 3.2 3.2L14 5.5"
                          fill="none"
                          stroke="currentColor"
                          stroke-linecap="round"
                          stroke-linejoin="round"
                          stroke-width="1.8"></path>
                </svg>
              </button>
              <button
                      class="services-contact__country-option"
                      type="button"
                      role="option"
                      aria-selected="false"
                      data-country="by"
                      data-code="+375"
                      data-name="Беларусь">
                <svg class="services-contact__country-flag" viewBox="0 0 22 15" aria-hidden="true" focusable="false">
                  <rect width="22" height="10" fill="#d22730"></rect>
                  <rect y="10" width="22" height="5" fill="#009739"></rect>
                  <rect width="4" height="15" fill="#fff"></rect>
                  <path d="M1 0h2v15H1z" fill="#d22730"></path>
                  <path d="M0 2h4M0 5h4M0 8h4M0 11h4M0 14h4" stroke="#fff" stroke-width=".6"></path>
                </svg>
                <span class="services-contact__country-code">+375</span>
                <span class="services-contact__country-name">Беларусь</span>
                <svg class="services-contact__country-check" viewBox="0 0 18 18" aria-hidden="true" focusable="false">
                  <path
                          d="m4 9 3.2 3.2L14 5.5"
                          fill="none"
                          stroke="currentColor"
                          stroke-linecap="round"
                          stroke-linejoin="round"
                          stroke-width="1.8"></path>
                </svg>
              </button>
              <button
                      class="services-contact__country-option"
                      type="button"
                      role="option"
                      aria-selected="false"
                      data-country="kz"
                      data-code="+7"
                      data-name="Казахстан">
                <svg class="services-contact__country-flag" viewBox="0 0 22 15" aria-hidden="true" focusable="false">
                  <rect width="22" height="15" fill="#00afca"></rect>
                  <circle cx="11" cy="6" r="2.1" fill="#f6d24a"></circle>
                  <g fill="none" stroke="#f6d24a" stroke-width=".6">
                    <circle cx="11" cy="6" r="3.1"></circle>
                    <path d="M7 11h8l-4-2z" fill="#f6d24a"></path>
                  </g>
                </svg>
                <span class="services-contact__country-code">+7</span>
                <span class="services-contact__country-name">Казахстан</span>
                <svg class="services-contact__country-check" viewBox="0 0 18 18" aria-hidden="true" focusable="false">
                  <path
                          d="m4 9 3.2 3.2L14 5.5"
                          fill="none"
                          stroke="currentColor"
                          stroke-linecap="round"
                          stroke-linejoin="round"
                          stroke-width="1.8"></path>
                </svg>
              </button>
              <button
                      class="services-contact__country-option"
                      type="button"
                      role="option"
                      aria-selected="false"
                      data-country="kg"
                      data-code="+996"
                      data-name="Киргизия">
                <svg class="services-contact__country-flag" viewBox="0 0 22 15" aria-hidden="true" focusable="false">
                  <rect width="22" height="15" fill="#e8112d"></rect>
                  <circle cx="11" cy="7.5" r="3.4" fill="none" stroke="#ffde00" stroke-width=".8"></circle>
                  <g stroke="#ffde00" stroke-width=".45">
                    <path d="M11 3.5v8M7 7.5h8M8.2 4.7l5.6 5.6M13.8 4.7l-5.6 5.6"></path>
                  </g>
                </svg>
                <span class="services-contact__country-code">+996</span>
                <span class="services-contact__country-name">Киргизия</span>
                <svg class="services-contact__country-check" viewBox="0 0 18 18" aria-hidden="true" focusable="false">
                  <path
                          d="m4 9 3.2 3.2L14 5.5"
                          fill="none"
                          stroke="currentColor"
                          stroke-linecap="round"
                          stroke-linejoin="round"
                          stroke-width="1.8"></path>
                </svg>
              </button>
              <button
                      class="services-contact__country-option"
                      type="button"
                      role="option"
                      aria-selected="false"
                      data-country="uz"
                      data-code="+998"
                      data-name="Узбекистан">
                <svg class="services-contact__country-flag" viewBox="0 0 22 15" aria-hidden="true" focusable="false">
                  <rect width="22" height="5" fill="#1eb5e5"></rect>
                  <rect y="5" width="22" height="5" fill="#fff"></rect>
                  <rect y="10" width="22" height="5" fill="#1eb53a"></rect>
                  <path d="M0 4.5h22M0 10.5h22" stroke="#ce1126" stroke-width=".6"></path>
                  <circle cx="4" cy="2.4" r="1.1" fill="#fff"></circle>
                  <circle cx="4.4" cy="2.1" r=".9" fill="#1eb5e5"></circle>
                </svg>
                <span class="services-contact__country-code">+998</span>
                <span class="services-contact__country-name">Узбекистан</span>
                <svg class="services-contact__country-check" viewBox="0 0 18 18" aria-hidden="true" focusable="false">
                  <path
                          d="m4 9 3.2 3.2L14 5.5"
                          fill="none"
                          stroke="currentColor"
                          stroke-linecap="round"
                          stroke-linejoin="round"
                          stroke-width="1.8"></path>
                </svg>
              </button>
            </div>
            <div class="services-contact__country-back">
              <button class="back-btn" type="button" data-callback-country-close>Назад</button>
            </div>
          </div>
            <label class="callback-modal__visually-hidden" for="callbackModalPhone">Телефон</label>
            <input
              class="callback-modal__input callback-modal__input--phone"
              id="callbackModalPhone"
              name="phone"
              type="tel"
              placeholder="Телефон"
              autocomplete="tel-national"
              data-country-code="+7">
          </div>
        </div>

        <p class="callback-modal__hint">* - поля, отмеченные звездочкой, обязательны для заполнения</p>

        <div class="callback-modal__captcha" aria-label="Проверка «Я не робот»">
          <img class="callback-modal__captcha-image" src="./static/images/popups/callback-modal/captcha.png" alt="Я не робот — reCAPTCHA">
          <label class="callback-modal__captcha-control">
            <input class="callback-modal__captcha-input" type="checkbox" aria-label="Я не робот">
            <span class="callback-modal__captcha-check" aria-hidden="true">✓</span>
          </label>
        </div>

        <button class="callback-modal__submit" type="submit">Отправить</button>

        <label class="callback-modal__agreement" for="callbackModalAgreement">
          <span class="callback-modal__agreement-control">
            <input class="callback-modal__agreement-input" id="callbackModalAgreement" name="agreement" type="checkbox" required>
            <img src="./static/images/popups/callback-modal/agreement-check.png" alt="" aria-hidden="true">
            <span class="callback-modal__agreement-mark" aria-hidden="true"></span>
          </span>
          <span class="callback-modal__agreement-text">Согласен с и&nbsp;условиями обработки персональных данных&nbsp;и&nbsp;политикой конфиденциальности</span>
        </label>

        <p class="callback-modal__status" id="callbackModalStatus" role="status" aria-live="polite" hidden></p>
      </form>
    </div>

    <div class="callback-modal__mobile-footer">
      <button class="callback-modal__back" type="button" data-callback-modal-close>Назад</button>
    </div>
  </section>
</div>
