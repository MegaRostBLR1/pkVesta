<section class="home" aria-labelledby="home-title">
  <div class="home__hero">
    <div class="home__background" aria-hidden="true"></div>

    <div class="home__content">
      <div class="home__main">
        <div class="home__category">
          <span class="home__category-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" role="presentation">
              <path d="M12 3.5c-3.45 0-6.25 2.79-6.25 6.24 0 4.7 6.25 10.76 6.25 10.76s6.25-6.06 6.25-10.76A6.24 6.24 0 0 0 12 3.5Zm0 8.25a2.25 2.25 0 1 1 0-4.5 2.25 2.25 0 0 1 0 4.5Z"/>
            </svg>
          </span>
          <span class="home__category-text">Быстровозводимые здания из легких металлоконструкций</span>
        </div>

        <div class="home__heading">
          <h1 class="home__title" id="home-title">
            ВЫ ПРОЕКТИРУЕТЕ ОНЛАЙН.<br>
            <span>мы изготавливаем под заказ</span>
          </h1>
          <p class="home__subtitle">
            Поставка зданий на рынки Евразии, Ближнего Востока, Африки и Латинской Америки
          </p>
        </div>

        <div class="home__actions" aria-label="Расчёт стоимости">
          <button class="home__button home__button--primary" type="button">Онлайн расчет</button>
          <button class="home__button home__button--secondary" type="button">Запросить расчет</button>
        </div>
      </div>

      <div class="home__slider" aria-hidden="true">
        <span class="home__arrow home__arrow--prev">
          <svg viewBox="0 0 40 40" role="presentation">
            <path d="m22.5 8.5-11 11.5 11 11.5"/>
          </svg>
        </span>

        <div class="home__pagination">
          <span class="home__dot home__dot--active"></span>
          <span class="home__dot"></span>
          <span class="home__dot"></span>
          <span class="home__dot"></span>
        </div>

        <span class="home__arrow home__arrow--next">
          <svg viewBox="0 0 40 40" role="presentation">
            <path d="m17.5 8.5 11 11.5-11 11.5"/>
          </svg>
        </span>
      </div>
    </div>
  </div>
</section>
