<button
          class="mob-filter-button"
          type="button"
          aria-haspopup="dialog"
          aria-expanded="false"
          aria-controls="prices-filter-dialog">
          <span>Параметры</span>
          <img src="/static/images/news/settings-ic.svg" alt="" aria-hidden="true" />
        </button>

        <div class="mob-filter-overlay" id="prices-filter-dialog" hidden>
          <div
            class="mob-filter-dialog"
            role="dialog"
            aria-modal="true"
            aria-labelledby="prices-filter-title"
            tabindex="-1">
            <div class="mob-filter-dialog__header">
              <h2 class="mob-filter-dialog__title" id="prices-filter-title">Параметры</h2>
              <button class="mob-filter-dialog__close" type="button" aria-label="Закрыть параметры">
                <svg
                  width="24"
                  height="24"
                  viewBox="0 0 24 24"
                  fill="none"
                  xmlns="http://www.w3.org/2000/svg"
                  aria-hidden="true">
                  <path
                    d="M18 6L6 18"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke="currentColor" />
                  <path
                    d="M6 6L18 18"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke="currentColor" />
                </svg>
              </button>
            </div>

            <div class="mob-filter-dialog__content">
              <div class="mob-filter-dialog__group" role="group" aria-labelledby="prices-region-title">
                <div class="mob-filter-dialog__group-title" id="prices-region-title">Регион:</div>
                <div class="mob-filter-dialog__list" data-filter-list="region">
                  <button
                    class="mob-filter-dialog__option is-selected"
                    type="button"
                    aria-pressed="true"
                    data-filter-value="Россия">
                    Россия
                  </button>
                  <button class="mob-filter-dialog__option" type="button" aria-pressed="false" data-filter-value="СНГ">
                    СНГ
                  </button>
                  <button
                    class="mob-filter-dialog__option"
                    type="button"
                    aria-pressed="false"
                    data-filter-value="Африка и Ближний Восток">
                    Африка и Ближний Восток
                  </button>
                </div>
              </div>

              <div class="mob-filter-dialog__group" role="group" aria-labelledby="prices-width-title">
                <div class="mob-filter-dialog__group-title" id="prices-width-title">Ширина:</div>
                <div class="mob-filter-dialog__list" data-filter-list="width">
                  <button
                    class="mob-filter-dialog__option is-selected"
                    type="button"
                    aria-pressed="true"
                    data-filter-value="12 м">
                    12 м
                  </button>
                  <button class="mob-filter-dialog__option" type="button" aria-pressed="false" data-filter-value="18 м">
                    18 м
                  </button>
                  <button class="mob-filter-dialog__option" type="button" aria-pressed="false" data-filter-value="24 м">
                    24 м
                  </button>
                  <button class="mob-filter-dialog__option" type="button" aria-pressed="false" data-filter-value="30 м">
                    30 м
                  </button>
                </div>
                <button
                  class="mob-filter-dialog__show-more"
                  type="button"
                  aria-expanded="false"
                  data-expand-list="width">
                  <span>Показать еще</span>
                  <svg
                    class="mob-filter-dialog__show-more-icon"
                    aria-hidden="true"
                    width="24"
                    height="24"
                    viewBox="0 0 24 24"
                    fill="none"
                    xmlns="http://www.w3.org/2000/svg">
                    <path
                      d="M6 9L12 15L18 9"
                      stroke-width="2"
                      stroke-linecap="round"
                      stroke-linejoin="round"
                      stroke="currentColor" />
                  </svg>
                </button>
              </div>

              <div class="mob-filter-dialog__group" role="group" aria-labelledby="prices-height-title">
                <div class="mob-filter-dialog__group-title" id="prices-height-title">Высота:</div>
                <div class="mob-filter-dialog__list" data-filter-list="height">
                  <button
                    class="mob-filter-dialog__option is-selected"
                    type="button"
                    aria-pressed="true"
                    data-filter-value="4 м">
                    4 м
                  </button>
                  <button class="mob-filter-dialog__option" type="button" aria-pressed="false" data-filter-value="5 м">
                    5 м
                  </button>
                  <button class="mob-filter-dialog__option" type="button" aria-pressed="false" data-filter-value="6 м">
                    6 м
                  </button>
                  <button class="mob-filter-dialog__option" type="button" aria-pressed="false" data-filter-value="7 м">
                    7 м
                  </button>
                </div>
                <button
                  class="mob-filter-dialog__show-more"
                  type="button"
                  aria-expanded="false"
                  data-expand-list="height">
                  <span>Показать еще</span>
                  <svg
                    class="mob-filter-dialog__show-more-icon"
                    aria-hidden="true"
                    width="24"
                    height="24"
                    viewBox="0 0 24 24"
                    fill="none"
                    xmlns="http://www.w3.org/2000/svg">
                    <path
                      d="M6 9L12 15L18 9"
                      stroke-width="2"
                      stroke-linecap="round"
                      stroke-linejoin="round"
                      stroke="currentColor" />
                  </svg>
                </button>
              </div>

              <div class="mob-filter-dialog__group" role="group" aria-labelledby="prices-roof-title">
                <div class="mob-filter-dialog__group-title" id="prices-roof-title">Кровля:</div>
                <div class="mob-filter-dialog__list" data-filter-list="roof">
                  <button
                    class="mob-filter-dialog__option is-selected"
                    type="button"
                    aria-pressed="true"
                    data-filter-value="Двухскатная">
                    Двухскатная
                  </button>
                  <button
                    class="mob-filter-dialog__option"
                    type="button"
                    aria-pressed="false"
                    data-filter-value="Плоская">
                    Плоская
                  </button>
                </div>
              </div>
            </div>
          </div>

          <div class="mob-filter-overlay__back-wrapper">
            <button class="mob-filter-overlay__back" type="button">Назад</button>
          </div>
        </div>
